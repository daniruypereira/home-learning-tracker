    function formatDateUK(isoStr) {
      if (!isoStr) return '';
      const parts = isoStr.split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : isoStr;
    }

    function formatShortDateUK(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return isoStr;
      return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function getTodayISO() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function addDaysISO(isoStr, days) {
      const d = new Date(isoStr + 'T00:00:00');
      d.setDate(d.getDate() + days);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function diffDays(fromISO, toISO) {
      const a = new Date(fromISO + 'T00:00:00');
      const b = new Date(toISO + 'T00:00:00');
      return Math.round((b - a) / (24 * 60 * 60 * 1000));
    }

    function getWeekBoundsISO(isoStr) {
      const d = new Date(isoStr + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return { start: isoStr, end: isoStr };
      const dayOfWeek = (d.getDay() + 6) % 7;
      const monday = new Date(d);
      monday.setDate(d.getDate() - dayOfWeek);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      const fmt = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
      return { start: fmt(monday), end: fmt(sunday) };
    }

    function isDateInSameWeek(dateA, dateB) {
      if (!dateA || !dateB) return false;
      const boundsA = getWeekBoundsISO(dateA);
      return dateB >= boundsA.start && dateB <= boundsA.end;
    }

    function calculateHalfTermGrade(pupilId, savedHomeworks, cbMode = 'standard') {
      const styles = getStatusStyles(cbMode);
      const total = savedHomeworks.length;
      if (total === 0) {
        return {
          grade: null, label: 'No Data', completed: 0, missed: 0, total: 0, percentage: 100,
          badgeBg: 'bg-[#e9e1d2] text-[#5e5243] dark:bg-slate-800 dark:text-slate-300 border-[#d6cbb7] dark:border-slate-700',
          softBg: 'bg-[#f5efe4] text-[#5e5243] dark:bg-slate-800/60 dark:text-slate-300 border-[#ddd3c0] dark:border-slate-700',
          symbol: '—'
        };
      }
      let completed = 0;
      savedHomeworks.forEach((hw) => { if (hw.completedIds.includes(pupilId)) completed += 1; });
      const missed = total - completed;
      const percentage = Math.round((completed / total) * 100);

      if (missed >= 3 || percentage < 50) {
        return { grade: 1, label: 'Concern', completed, missed, total, percentage, badgeBg: styles.grade1.badgeBg, softBg: styles.grade1.softBg, symbol: styles.grade1.symbol };
      }
      if (percentage >= 80) {
        return { grade: 3, label: 'Excellent', completed, missed, total, percentage, badgeBg: styles.grade3.badgeBg, softBg: styles.grade3.softBg, symbol: styles.grade3.symbol };
      }
      return { grade: 2, label: 'Good', completed, missed, total, percentage, badgeBg: styles.grade2.badgeBg, softBg: styles.grade2.softBg, symbol: styles.grade2.symbol };
    }

    function parseSheetRowsToClass(sheetName, rows, importTasks = true) {
      const cleanName = sheetName
        .replace(/^di[aá]rio\s+de\s+classe\s*[-–:]\s*/i, '')
        .replace(/^class\s*[-–:]\s*/i, '')
        .trim() || 'Imported Class';

      let headerIdx = -1, colNo = -1, colLast = -1, colFirst = -1, colTutor = -1;
      for (let r = 0; r < Math.min(rows.length, 15); r++) {
        const row = rows[r] || [];
        for (let c = 0; c < row.length; c++) {
          const cell = String(row[c] ?? '').trim().toLowerCase();
          if (cell === 'last name' || cell === 'surname' || cell === 'sobrenome') colLast = c;
          if (cell === 'first name' || cell === 'forename' || cell === 'nome') colFirst = c;
          if (cell === 'no.' || cell === 'no' || cell === '#' || cell === 'roll') colNo = c;
          if (cell === 'tutor group' || cell === 'tutor' || cell === 'form' || cell === 'reg') colTutor = c;
        }
        if (colLast !== -1 || colFirst !== -1) { headerIdx = r; break; }
      }

      if (headerIdx === -1) {
        const pupils = [];
        rows.forEach((row, idx) => {
          const nonEmpty = (row || []).map((v) => String(v ?? '').trim()).filter(Boolean);
          if (nonEmpty.length === 0) return;
          if (nonEmpty.length === 1) {
            const parts = nonEmpty[0].split(/\s+/);
            pupils.push({ id: `imp-${Date.now()}-${idx}`, no: pupils.length + 1, firstName: parts[0] || 'Pupil', lastName: parts.slice(1).join(' ') || '', tutorGroup: '' });
          } else {
            pupils.push({ id: `imp-${Date.now()}-${idx}`, no: pupils.length + 1, lastName: nonEmpty[0], firstName: nonEmpty[1], tutorGroup: nonEmpty[2] || '' });
          }
        });
        return {
          id: `class-${cleanName.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${Math.random().toString(36).slice(2, 5)}`,
          name: cleanName,
          pupils,
          homeworks: [{ id: `hw-${Date.now()}-1`, title: 'Home Learning 1', date: getTodayISO(), saved: false, completedIds: [] }]
        };
      }

      const headerRow = rows[headerIdx] || [];
      const nextRow = rows[headerIdx + 1] || [];
      const hasDateSubRow = nextRow.some((v) => String(v ?? '').trim().toLowerCase() === 'date');
      const dataStartIdx = hasDateSubRow ? headerIdx + 2 : headerIdx + 1;

      const taskCols = [];
      if (importTasks) {
        const startTaskCol = Math.max(colNo, colLast, colFirst, colTutor) + 1;
        for (let c = startTaskCol; c < Math.max(headerRow.length, nextRow.length); c++) {
          const hTitle = String(headerRow[c] ?? '').trim();
          const dLabel = hasDateSubRow ? String(nextRow[c] ?? '').trim() : '';
          if (hTitle || dLabel) {
            taskCols.push({ colIndex: c, title: hTitle && dLabel ? `${hTitle} (${dLabel})` : hTitle || `Task (${dLabel})`, rawDate: dLabel });
          }
        }
      }

      const pupils = [];
      const taskCompletionMap = {};
      taskCols.forEach((tc) => { taskCompletionMap[tc.colIndex] = []; });

      for (let r = dataStartIdx; r < rows.length; r++) {
        const row = rows[r] || [];
        const lastName = colLast !== -1 ? String(row[colLast] ?? '').trim() : '';
        const firstName = colFirst !== -1 ? String(row[colFirst] ?? '').trim() : '';
        const tutorGroup = colTutor !== -1 ? String(row[colTutor] ?? '').trim() : '';
        const rawNo = colNo !== -1 ? parseInt(String(row[colNo] ?? '').trim(), 10) : NaN;
        if (!lastName && !firstName) continue;

        const pupilId = `imp-${cleanName.replace(/\s+/g, '')}-${pupils.length + 1}-${Math.random().toString(36).slice(2, 5)}`;
        pupils.push({ id: pupilId, no: Number.isNaN(rawNo) ? pupils.length + 1 : rawNo, lastName: lastName || 'Surname', firstName: firstName || 'Forename', tutorGroup });

        taskCols.forEach((tc) => {
          const val = String(row[tc.colIndex] ?? '').trim().toLowerCase();
          const isMissed = val === 'n' || val === 'no' || val === 'x' || val === '0' || val.startsWith('b');
          if (!isMissed) taskCompletionMap[tc.colIndex].push(pupilId);
        });
      }

      const homeworks = taskCols.map((tc, idx) => ({
        id: `hw-imp-${Date.now()}-${idx}`,
        title: tc.title,
        date: getTodayISO(),
        saved: true,
        completedIds: taskCompletionMap[tc.colIndex]
      }));

      if (homeworks.length === 0) {
        homeworks.push({ id: `hw-${Date.now()}-1`, title: 'Home Learning 1', date: getTodayISO(), saved: false, completedIds: [] });
      }

      return {
        id: `class-${cleanName.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${Math.random().toString(36).slice(2, 5)}`,
        name: cleanName,
        pupils,
        homeworks
      };
    }

      const buildCompactTransferPayload = (scope = qrScope) => {

      const compressPayloadToBase64Url = async (jsonStr) => {
        try {
          if (typeof CompressionStream !== 'undefined') {
            const bytes = new TextEncoder().encode(jsonStr);
            const cs = new CompressionStream('deflate-raw');
            const writer = cs.writable.getWriter();
            writer.write(bytes);
            writer.close();
            const buf = await new Response(cs.readable).arrayBuffer();
            const arr = new Uint8Array(buf);
            let bin = '';
            for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
            return 'z.' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          }
        } catch {}
        return 'u.' + btoa(unescape(encodeURIComponent(jsonStr))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      };

      const decompressBase64UrlToJson = async (token) => {
        if (token.startsWith('z.')) {
          const b64 = token.slice(2).replace(/-/g, '+').replace(/_/g, '/');
          const bin = atob(b64);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const ds = new DecompressionStream('deflate-raw');
          const writer = ds.writable.getWriter();
          writer.write(bytes);
          writer.close();
          const buf = await new Response(ds.readable).arrayBuffer();
          return new TextDecoder().decode(buf);
        }
        const raw = token.startsWith('u.') ? token.slice(2) : token;
        const b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
        return decodeURIComponent(escape(atob(b64)));
      };

      const buildQrAndTransferLink = async (scopeOverride = qrScope) => {

                try {
                  const codes = await detector.detect(videoRef.current);
                  if (codes && codes.length > 0 && codes[0].rawValue) {
                    const scannedUrl = codes[0].rawValue;
                    const hashIdx = scannedUrl.indexOf('#sync=');
                    if (hashIdx !== -1) {
                      const token = scannedUrl.slice(hashIdx + 6);
                      const jsonStr = await decompressBase64UrlToJson(token);
                      const parsed = JSON.parse(jsonStr);
                      if (applyImportedCompactData(parsed)) {
                        stopQrCameraScanner();
                        setShowSyncModal(false);
                        showToast('All classes & homework checks transferred from QR Code!');
                        return;
                      }
                    }
                  }
                } catch {}
                if (scanStreamRef.current) requestAnimationFrame(scanLoop);
              };
              requestAnimationFrame(scanLoop);
            }
          }, 150);

        }

          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          if (!ctx) return '';

          const bgGrad = ctx.createLinearGradient(0, 0, size, size);
          bgGrad.addColorStop(0, '#fbf8f2');
          bgGrad.addColorStop(1, '#ede4d3');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, size, size);

          const cx = size * 0.5;
          const cy = size * 0.51;
          const bookW = size * 0.54;
          const bookH = size * 0.44;
          const bx = cx - bookW / 2;
          const by = cy - bookH / 2;

          ctx.fillStyle = '#4a3b2c';
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(bx - size * 0.02, by + size * 0.01, bookW + size * 0.04, bookH + size * 0.018, size * 0.045);
          } else {
            ctx.rect(bx - size * 0.02, by + size * 0.01, bookW + size * 0.04, bookH + size * 0.018);
          }
          ctx.fill();

          const pageGap = size * 0.012;
          const pageW = (bookW - pageGap) / 2;

          ctx.fillStyle = '#fffdf9';
          ctx.beginPath();
          ctx.rect(bx, by, pageW, bookH);
          ctx.fill();

          ctx.fillStyle = '#faf5eb';
          ctx.beginPath();
          ctx.rect(bx + pageW + pageGap, by, pageW, bookH);
          ctx.fill();

          const drawCheck = (x, y, s, color) => {
            ctx.strokeStyle = color;
            ctx.lineWidth = Math.max(2.5, size * 0.022);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(x - s * 0.45, y);
            ctx.lineTo(x - s * 0.1, y + s * 0.38);
            ctx.lineTo(x + s * 0.55, y - s * 0.42);
            ctx.stroke();
          };

          const drawRule = (x, y, w) => {
            ctx.strokeStyle = '#d6c9b4';
            ctx.lineWidth = Math.max(2, size * 0.015);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + w, y);
            ctx.stroke();
          };

          [0.24, 0.50, 0.76].forEach((ratio) => {
            const ry = by + bookH * ratio;
            drawCheck(bx + pageW * 0.25, ry, size * 0.042, '#059669');
            drawRule(bx + pageW * 0.44, ry, pageW * 0.42);
          });

          [0.24, 0.50].forEach((ratio) => {
            const ry = by + bookH * ratio;
            drawCheck(bx + pageW + pageGap + pageW * 0.25, ry, size * 0.042, '#059669');
            drawRule(bx + pageW + pageGap + pageW * 0.44, ry, pageW * 0.42);
          });

          const ry3 = by + bookH * 0.76;
          ctx.fillStyle = '#d97706';
          ctx.beginPath();
          ctx.arc(bx + pageW + pageGap + pageW * 0.25, ry3, size * 0.019, 0, Math.PI * 2);
          ctx.fill();
          drawRule(bx + pageW + pageGap + pageW * 0.44, ry3, pageW * 0.42);

          const badgeR = size * 0.085;
          const badgeX = bx + bookW - size * 0.02;
          const badgeY = by - size * 0.01;
          ctx.fillStyle = '#059669';
          ctx.beginPath();
          ctx.arc(badgeX, badgeY, badgeR, 0, Math.PI * 2);
          ctx.fill();
          drawCheck(badgeX, badgeY + size * 0.004, size * 0.055, '#ffffff');

          return canvas.toDataURL('image/png');

                  <label className="flex items-center gap-2 text-xs font-bold cursor-pointer">
                    <input type="checkbox" checked={testNoHwWeek} onChange={(e) => setTestNoHwWeek(e.target.checked)} />
                    <span>Remind me not to set homework that week</span>
                  </label>
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setShowTestModal(false)} className="px-4 py-2 rounded-xl text-sm font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-amber-700 text-white text-sm font-bold">Save Test</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Schedule Due Homework Modal */}
          {showScheduleDueModal && (
            <div className="fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4 overflow-y-auto">
              <div className={`w-full max-w-md rounded-3xl p-6 border shadow-2xl max-h-[90vh] overflow-y-auto ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-[#fbf8f2] border-[#e2d7c3]'}`}>
                <h3 className="text-lg font-extrabold mb-3">Assign Homework Due Date</h3>
                <form onSubmit={handleSaveScheduledHomework} className="space-y-4">
                  <input type="text" value={dueTitleInput} onChange={(e) => setDueTitleInput(e.target.value)} placeholder="Homework title..." className={`w-full px-4 py-3 rounded-xl border text-sm ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-[#f4ede0] border-[#dcd0ba]'}`} autoFocus />
                  <input type="date" value={dueDateInput} onChange={(e) => setDueDateInput(e.target.value)} className={`w-full px-4 py-3 rounded-xl border text-sm ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-[#f4ede0] border-[#dcd0ba]'}`} />
                  {getNoHwWeekTestsForDate(dueDateInput, dueSelectedClassIds).length > 0 && (
                    <div className="p-3 rounded-xl bg-amber-100 dark:bg-amber-950/60 border border-amber-500 text-xs font-bold">
                      Assessment Week Reminder: Test booked during this week!
                    </div>
                  )}
                  <div className="flex flex-wrap gap-2">
                    {classes.map((cls) => {
                      const sel = dueSelectedClassIds.includes(cls.id);
                      return (
                        <button key={cls.id} type="button" onClick={() => setDueSelectedClassIds((p) => sel ? p.filter((x) => x !== cls.id) : [...p, cls.id])} className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border ${sel ? 'bg-stone-800 dark:bg-indigo-600 text-white' : 'bg-[#f4ede0] dark:bg-slate-800'}`}>{cls.name}</button>
                      );
                    })}
                  </div>
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setShowScheduleDueModal(false)} className="px-4 py-2 rounded-xl text-sm font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-stone-800 dark:bg-indigo-600 text-white text-sm font-bold">Schedule</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* New Homework Check Modal */}
          {showNewHwModal && currentClass && (
            <div className="fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4">
              <div className={`w-full max-w-md rounded-3xl p-6 border shadow-2xl ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-[#fbf8f2] border-[#e2d7c3]'}`}>
                <h3 className="text-lg font-extrabold mb-3">New Homework Check ({currentClass.name})</h3>
                <form onSubmit={handleCreateHomework} className="space-y-4">
                  <input type="text" value={newHwTitle} onChange={(e) => setNewHwTitle(e.target.value)} placeholder={`Home Learning ${currentClass.homeworks.length + 1}`} className={`w-full px-4 py-3 rounded-xl border text-sm ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-[#f4ede0] border-[#dcd0ba]'}`} autoFocus />
                  <input type="date" value={newHwDate} onChange={(e) => setNewHwDate(e.target.value)} className={`w-full px-4 py-3 rounded-xl border text-sm ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-[#f4ede0] border-[#dcd0ba]'}`} />
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setShowNewHwModal(false)} className="px-4 py-2 rounded-xl text-sm font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-stone-800 dark:bg-indigo-600 text-white text-sm font-bold">Start Check</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Upload Spreadsheet Modal */}
          {showUploadModal && (
            <div className="fixed inset-0 z-[60] bg-black/65 flex items-center justify-center p-4 overflow-y-auto">
              <div className={`w-full max-w-xl rounded-3xl p-6 border shadow-2xl max-h-[90vh] overflow-y-auto ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-[#fbf8f2] border-[#e2d7c3]'}`}>
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-lg font-extrabold">Upload Spreadsheet (.xlsx, .xls, .csv)</h3>
                  <button type="button" onClick={() => setShowUploadModal(false)} className="p-2 rounded-xl bg-[#ede5d6] dark:bg-slate-800"><Icons.X className="w-4 h-4" /></button>
                </div>
                <div onClick={() => fileInputRef.current?.click()} className="border-2 border-dashed border-[#d3c6b0] dark:border-slate-700 rounded-2xl p-6 text-center cursor-pointer bg-[#f4ede0] dark:bg-slate-800/40">
                  <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv,.tsv,.txt" onChange={handleSpreadsheetFileSelected} className="hidden" />
                  <Icons.Upload className="w-8 h-8 mx-auto mb-2 text-amber-900 dark:text-indigo-400" />
                  <p className="text-sm font-extrabold">{isParsingFile ? 'Reading spreadsheet...' : uploadFileName || 'Tap to choose spreadsheet file'}</p>
                </div>
                {uploadError && <p className="text-rose-600 text-xs font-bold mt-2">{uploadError}</p>}
                <div className="grid grid-cols-3 gap-2 mt-4">
                  {[
                    { id: 'merge', title: 'Merge & Refresh' },
                    { id: 'replace', title: 'Replace All' },
                    { id: 'current', title: 'Current Class' }
                  ].map((m) => (
                    <button key={m.id} type="button" onClick={() => setUploadMode(m.id)} className={`p-2.5 rounded-xl border text-xs font-extrabold ${uploadMode === m.id ? 'bg-stone-800 dark:bg-indigo-600 text-white' : 'bg-[#f4ede0] dark:bg-slate-800'}`}>{m.title}</button>
                  ))}
                </div>
                <div className="mt-5 flex items-center justify-between">
                  <button type="button" onClick={handleDownloadTemplateCSV} className="px-3 py-2 rounded-xl bg-[#ede5d6] dark:bg-slate-800 text-xs font-bold">Download CSV Template</button>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setShowUploadModal(false)} className="px-4 py-2 rounded-xl text-xs font-bold">Cancel</button>
                    <button type="button" disabled={!uploadedPreviewClasses} onClick={applyUploadedSpreadsheet} className="px-5 py-2 rounded-xl bg-stone-800 dark:bg-indigo-600 text-white text-xs font-extrabold disabled:opacity-40">Apply &amp; Refresh</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Cross-Device Sync & Backup Modal (100% Offline QR + Direct Link — Zero School Wi-Fi Needed) */}
          {showSyncModal && (
            <div className="fixed inset-0 z-[60] bg-black/65 flex items-center justify-center p-4 overflow-y-auto">
              <div className={`w-full max-w-lg rounded-3xl p-6 border shadow-2xl max-h-[90vh] overflow-y-auto ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-[#fbf8f2] border-[#e2d7c3]'}`}>
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2.5">
                    <div className="w-10 h-10 rounded-2xl bg-emerald-600 text-white flex items-center justify-center">
                      <Icons.QrCode className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-lg font-extrabold leading-tight">Transfer Between Phone &amp; Desktop</h3>
                      <p className="text-xs opacity-75">100% Offline QR Code — works even when school Wi-Fi blocks cloud sync</p>
                    </div>
                  </div>
                  <button type="button" onClick={() => setShowSyncModal(false)} className="p-2 rounded-xl bg-[#ede5d6] dark:bg-slate-800"><Icons.X className="w-4 h-4" /></button>
                </div>

                <div className="space-y-4">
                  {/* SECTION 1: SELF-CONTAINED QR CODE (ALL DATA EMBEDDED INSIDE QR) */}
                  <div className="p-4 rounded-2xl bg-[#f4ede0] dark:bg-slate-800/70 border border-[#dcd0ba] dark:border-slate-700 space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <p className="text-xs font-extrabold flex items-center gap-1.5">
                        <Icons.QrCode className="w-4 h-4 text-emerald-700 dark:text-emerald-400" />
                        <span>1. Offline QR Code (No School Wi-Fi Needed)</span>
                      </p>
                      <button
                        type="button"
                        onClick={async () => {
                          await buildQrAndTransferLink(qrScope);
                          showToast('QR Code updated with your latest ticks!');
                        }}
                        className="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold shadow-sm"
                      >
                        Refresh QR Code
                      </button>
                    </div>

                    {/* Toggle between Current Class (Extra-Large Crisp QR) and All Classes */}
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setQrScope('current')}
                        className={`py-2 px-3 rounded-xl border text-xs font-extrabold transition ${
                          qrScope === 'current'
                            ? 'bg-stone-800 dark:bg-indigo-600 text-white border-stone-800 dark:border-indigo-500'
                            : 'bg-[#fbf8f2] dark:bg-slate-900 border-[#dcd0ba] dark:border-slate-700'
                        }`}
                      >
                        Current Class Only ({currentClass?.name}) — Fast Scan
                      </button>
                      <button
                        type="button"
                        onClick={() => setQrScope('all')}
                        className={`py-2 px-3 rounded-xl border text-xs font-extrabold transition ${
                          qrScope === 'all'
                            ? 'bg-stone-800 dark:bg-indigo-600 text-white border-stone-800 dark:border-indigo-500'
                            : 'bg-[#fbf8f2] dark:bg-slate-900 border-[#dcd0ba] dark:border-slate-700'
                        }`}
                      >
                        All {classes.length} Classes Combined
                      </button>
                    </div>

                    <p className="text-[11px] opacity-85">
                      {qrScope === 'current'
                        ? `Transfers ${currentClass?.name} with all pupils & homework ticks directly inside a super-easy-to-scan QR Code.`
                        : 'Transfers all classes, pupils, homework ticks & tests directly inside this QR Code—zero external servers used.'}
                    </p>

                    {qrDataUrl && (
                      <div className="flex flex-col items-center justify-center p-4 rounded-2xl bg-white border border-[#dcd0ba] shadow-inner">
                        <img
                          src={qrDataUrl}
                          alt="Scan QR code with camera to transfer tracker"
                          className="w-64 h-64 sm:w-72 sm:h-72 object-contain"
                        />
                        <span className="mt-2 text-[11px] font-bold text-stone-700 text-center">
                          Point your iPhone or Android Camera here &amp; tap the link that appears
                        </span>
                      </div>
                    )}

                    <div className="flex flex-wrap gap-2 pt-1">
                      <button
                        type="button"
                        onClick={handleCopyTransferLink}
                        className="flex-1 py-2.5 px-3 rounded-xl bg-amber-700 hover:bg-amber-600 text-white text-xs font-extrabold shadow-sm"
                      >
                        Copy Direct Transfer Link
                      </button>
                      <button
                        type="button"
                        onClick={isScanningQr ? stopQrCameraScanner : startQrCameraScanner}
                        className="py-2.5 px-3 rounded-xl bg-stone-800 dark:bg-indigo-600 text-white text-xs font-extrabold"
                      >
                        {isScanningQr ? 'Stop Camera' : 'Scan QR With Webcam'}
                      </button>
                    </div>

                    {isScanningQr && (
                      <div className="rounded-2xl overflow-hidden border border-[#dcd0ba] bg-black">
                        <video ref={videoRef} className="w-full max-h-56 object-cover" muted playsInline />
                      </div>
                    )}
                    {qrScanError && <p className="text-[11px] text-rose-600 font-bold">{qrScanError}</p>}
                  </div>

                  {/* SECTION 2: MANUAL BACKUP FILE */}
                  <div className="p-4 rounded-2xl bg-[#f4ede0] dark:bg-slate-800/70 border border-[#dcd0ba] dark:border-slate-700 space-y-2.5">
                    <p className="text-xs font-bold">2. Backup File (Download / Restore)</p>
                    <p className="text-[11px] opacity-80">
                      Save a backup file to OneDrive / Google Drive or USB, and restore it on any computer.
                    </p>
                    <div className="flex flex-wrap gap-2">
                      <button type="button" onClick={handleExportBackupJSON} className="flex-1 py-2.5 px-3 rounded-xl bg-stone-800 dark:bg-indigo-600 text-white text-xs font-bold flex items-center justify-center gap-1.5">
                        <Icons.Download className="w-4 h-4" />
                        <span>Download Backup</span>
                      </button>
                      <button type="button" onClick={() => backupFileInputRef.current?.click()} className="flex-1 py-2.5 px-3 rounded-xl border border-[#cbbba0] dark:border-slate-600 text-xs font-bold flex items-center justify-center gap-1.5">
                        <Icons.Upload className="w-4 h-4" />
                        <span>Restore Backup</span>
                      </button>
                      <input ref={backupFileInputRef} type="file" accept=".json" onChange={handleImportBackupJSON} className="hidden" />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Mobile Bottom Navigation */}
          <nav className={`sm:hidden fixed bottom-0 inset-x-0 z-30 border-t backdrop-blur-md px-2 py-1.5 grid grid-cols-4 gap-1 ${darkMode ? 'bg-slate-900/95 border-slate-800' : 'bg-[#fbf8f2]/95 border-[#e2d7c3]'}`}>
            {[
              { id: 'check', label: 'Check', IconComp: Icons.ClipboardCheck },
              { id: 'grades', label: 'Grades', IconComp: Icons.Award },
              { id: 'manage', label: 'Classes', IconComp: Icons.Users },
              { id: 'settings', label: 'Settings', IconComp: Icons.Settings }
            ].map(({ id, label, IconComp }) => (
              <button
                key={id}
                type="button"
                onClick={() => setActiveTab(id)}
                className={`py-2 rounded-xl flex flex-col items-center justify-center gap-0.5 text-[11px] font-bold ${activeTab === id ? 'bg-stone-800 dark:bg-indigo-600 text-amber-50 dark:text-white' : 'opacity-70'}`}
              >
                <IconComp className="w-4 h-4" />
                <span>{label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
